name: shopora
description: "A production-level Flutter E-Commerce mobile application with Firebase backend integration, Clean Architecture, and Riverpod state management."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.9
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8
  google_sign_in: ^6.1.6
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  go_router: ^13.0.1
  intl: ^0.18.1
  cupertino_icons: ^1.0.6
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
